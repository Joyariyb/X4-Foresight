<!-- Core role: Main dashboard HTML template (tabs: Universe, Sectors, Stations, Fleet, Crew, Diplomacy, Resources, Designs). -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X4 · Empire Intelligence</title>
  <!-- Qt WebChannel client lib (qrc:// is served by QtWebEngine only). Defines the
       QWebChannel constructor that scan-loader.js uses to reach the Python bridge.
       Must load before the shell scripts run, so it stays a static <head> tag rather
       than an entry in shell-loader's async script list. The web shell doesn't need it. -->
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <link rel="stylesheet" href="assets/tabler-icons_min.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/universe.css">
  <link rel="stylesheet" href="css/sectors.css">
  <link rel="stylesheet" href="css/shared-ui.css">
  <link rel="stylesheet" href="css/station-slider.css">
  <link rel="stylesheet" href="css/charts.css">
  <link rel="stylesheet" href="css/trends.css">
  <link rel="stylesheet" href="css/fleet-designs.css">
  <link rel="stylesheet" href="css/crew.css">
  <link rel="stylesheet" href="css/scrollbar.css">
</head>
<body>

<!-- DOM is injected at runtime from body.html (shared with ui/web/index.html)
     so the desktop and web shells stop needing hand-synced copies - see
     js/shell-loader.js. -->
<div id="app-root"></div>

<script src="js/shell-loader.js"></script>
<script>
  loadShell('body.html', [
    'js/constants.js',
    'js/tip-registry.js',
    'js/economy-chart.js',
    'js/economy-logs.js',
    'js/cashflow-chart.js',
    'js/trends.js',
    'js/formatters.js',
    'js/fleet.js',
    'js/hull-wireframes.js',
    'js/designs-builder.js',
    'js/resource-library.js',
    'js/hull-comparison.js',
    'js/equipment-comparison.js',
    'js/tooltips.js',
    'js/faction-tabs.js',
    'js/navigation.js',
    'js/crew.js',
    'js/station-helpers.js',
    'js/populate.js',
    'js/universe-map.js',
    'js/sectors.js',
    'js/scan-sound.js',
    'js/scan-loader.js',
    'js/init.js'
  ]);
</script>
</body>
</html>
