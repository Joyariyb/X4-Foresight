<!-- Core role: Main dashboard HTML template, web build (Pyodide + Web Worker
     instead of the desktop's QtWebEngine + QWebChannel). DOM is injected at
     runtime from ../body.html (shared with ui/ui.html) - see
     ../js/shell-loader.js. Only this <head> and the script list below
     (relative paths + the bridge scripts) differ from the desktop shell. -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X4 Foresight — Empire Intelligence Dashboard for X4: Foundations</title>
  <meta name="description" content="The X4 Foresight dashboard: load an X4: Foundations save and explore fleet, station economy, sector map, crew and Xenon threat alerts — all in your browser. Your save never leaves your machine.">
  <link rel="canonical" href="https://joyariyb.github.io/X4-Foresight/ui/web/index.html">
  <meta name="theme-color" content="#0d1117">
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <!-- Open Graph / Twitter (for shared links) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="X4 Foresight">
  <meta property="og:title" content="X4 Foresight — Empire Intelligence Dashboard for X4: Foundations">
  <meta property="og:description" content="Load an X4: Foundations save and explore fleet, economy, sectors, crew and threat alerts — entirely in your browser.">
  <meta property="og:url" content="https://joyariyb.github.io/X4-Foresight/ui/web/index.html">
  <meta property="og:image" content="https://joyariyb.github.io/X4-Foresight/assets/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://joyariyb.github.io/X4-Foresight/assets/og-image.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/tabler-icons_min.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/universe.css">
  <link rel="stylesheet" href="../css/sectors.css">
  <link rel="stylesheet" href="../css/shared-ui.css">
  <link rel="stylesheet" href="../css/station-slider.css">
  <link rel="stylesheet" href="../css/charts.css">
  <link rel="stylesheet" href="../css/trends.css">
  <link rel="stylesheet" href="../css/fleet-designs.css">
  <link rel="stylesheet" href="../css/crew.css">
  <link rel="stylesheet" href="../css/npc-stations.css">
  <link rel="stylesheet" href="../css/npc-station-inspector.css">
  <link rel="stylesheet" href="../css/scrollbar.css">
</head>
<body>

<div id="app-root"></div>

<script src="../js/shell-loader.js"></script>
<script src="../js/shell-manifest.js"></script>
<script>
  // Shared script order lives in ../js/shell-manifest.js. Only the web-build
  // bridge trio is listed here: it sets window._bridge before scan-loader.js
  // (in the manifest tail) runs its bridge-detection check, so the
  // QWebChannel/file-fallback branches there never get reached. Order matters
  // within the trio too: save-picker-dialog.js and fs-access.js define globals
  // pyodide-bridge.js calls.
  loadShell('../body.html', shellScripts('../', [
    'js/save-picker-dialog.js',
    'js/fs-access.js',
    'js/pyodide-bridge.js',
  ]));
</script>
</body>
</html>
