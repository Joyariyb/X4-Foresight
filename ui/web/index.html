<!-- Core role: Main dashboard HTML template, web build (Pyodide + Web Worker
     instead of the desktop's QtWebEngine + QWebChannel). DOM is injected at
     runtime from ../body.html (shared with ui/ui.html) - see
     ../js/shell-loader.js. Only this <head> and the script list below
     (relative paths + the bridge scripts) differ from the desktop shell. -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X4 · Empire Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/tabler-icons_min.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/universe.css">
  <link rel="stylesheet" href="../css/sectors.css">
  <link rel="stylesheet" href="../css/shared-ui.css">
  <link rel="stylesheet" href="../css/station-slider.css">
  <link rel="stylesheet" href="../css/charts.css">
  <link rel="stylesheet" href="../css/fleet-designs.css">
  <link rel="stylesheet" href="../css/crew.css">
  <link rel="stylesheet" href="../css/scrollbar.css">
</head>
<body>

<div id="app-root"></div>

<script src="../js/shell-loader.js"></script>
<script>
  loadShell('../body.html', [
    '../js/constants.js',
    '../js/economy-chart.js',
    '../js/cashflow-chart.js',
    '../js/formatters.js',
    '../js/fleet.js',
    '../js/hull-wireframes.js',
    '../js/designs-builder.js',
    '../js/resource-library.js',
    '../js/hull-comparison.js',
    '../js/tooltips.js',
    '../js/faction-tabs.js',
    '../js/navigation.js',
    '../js/crew.js',
    '../js/station-helpers.js',
    '../js/populate.js',
    '../js/universe-map.js',
    '../js/sectors.js',
    // Web-build bridge: sets window._bridge before scan-loader.js runs its
    // bridge-detection check, so the QWebChannel/file-fallback branches there
    // never get reached. Order matters: save-picker-dialog.js and
    // fs-access.js define globals pyodide-bridge.js calls.
    'js/save-picker-dialog.js',
    'js/fs-access.js',
    'js/pyodide-bridge.js',
    '../js/scan-loader.js',
    '../js/init.js'
  ]);
</script>
</body>
</html>
